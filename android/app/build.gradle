plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mirrorsound'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mirrorsound'
        minSdk 29          // AudioPlaybackCapture needs Android 10
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's QR scanner UI from Play services: no camera permission or camera code in the app.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
